name: VANO V2 security gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact dependency install (lockfile mandatory)
        run: npm ci --ignore-scripts
      - name: Unit and API security regression tests
        run: npm test
      - name: Frontend build
        run: npm run build
      - name: Dependency advisory check
        run: npm audit --audit-level=moderate
      - name: Ensure no secrets or local accounts were committed
        run: |
          if git ls-files | grep -E '(^|/)(\.env|store\.json|rootCA-key\.pem|vano-local-key\.pem)$'; then
            echo 'ERROR: secrets or account database tracked by Git'; exit 1
          fi
