name: VANO National Radar Catalogue

on:
  push:
    branches:
      - preview/vano-react-v2-7
    paths:
      - "v2/server/radar-catalog.mjs"
      - "v2/scripts/sync-radars.mjs"
      - "v2/data/radars-br.json"
      - ".github/workflows/vano-radar-data.yml"
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'miguel027dev/vano'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/vano-react-v2-7
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synchronize open Brazilian radar coordinates
        run: node v2/scripts/sync-radars.mjs
      - name: Verify dataset integrity
        run: node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('v2/data/radars-br.json'));if(d.rows.length<5000)process.exit(1);console.log('Verified',d.rows.length,'Brazilian radar locations')"
      - name: Commit validated snapshot for reliable offline serving
        run: |
          git config user.name 'VANO Radar Data Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/data/radars-br.json
          if ! git diff --cached --quiet; then
            git commit -m "data(v2): sync attributed Brazilian speed camera snapshot"
            git push origin HEAD:preview/vano-react-v2-7
          else
            echo "Radar snapshot unchanged"
          fi
