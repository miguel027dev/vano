name: VANO V2 Preview checks
on:
  push:
    branches: [preview/vano-react-v2-7]
    paths: ["v2/**", ".github/workflows/vano-v2-preview.yml"]
  pull_request:
    branches: [preview/vano-react-v2-7]
    paths: ["v2/**", ".github/workflows/vano-v2-preview.yml"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
