name: VANO experience review fixes

on:
  push:
    branches:
      - experience/motion-camera-refinement-20261003

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experience/motion-camera-refinement-20261003
          fetch-depth: 0

      - name: Apply reviewed fixes
        run: python tools/experience_fix_once.py

      - name: Validate reviewed files
        run: |
          python -m compileall -q app.py vano db_backend.py mobile_routes.py vano_osint_bridge.py vano_ai_routing.py vano_radars.py
          python -m pip install -r requirements.txt -r requirements-dev.txt
          pytest -q

      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix reviewed VANO motion edge cases"
          git push origin HEAD:experience/motion-camera-refinement-20261003
