name: VANO React Build

on:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/react-v2-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
