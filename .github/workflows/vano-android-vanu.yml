name: VANO Android WebView checks

on:
  pull_request:
    branches: [preview/vano-react-v2-7]
    paths:
      - "android-vanu/**"
      - ".github/workflows/vano-android-vanu.yml"
  push:
    branches: [preview/vano-react-v2-7]
    paths:
      - "android-vanu/**"
      - ".github/workflows/vano-android-vanu.yml"

permissions:
  contents: read

jobs:
  assemble-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build and lint WebView
        working-directory: android-vanu
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
