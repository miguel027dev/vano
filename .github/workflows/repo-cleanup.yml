name: VANO repository cleanup

on:
  push:
    branches:
      - cleanup/repository-css-20261003

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/repository-css-20261003
          fetch-depth: 0

      - name: Consolidate stylesheet references and remove unused files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          templates = root / "templates"
          static = root / "static"

          css_link_re = re.compile(
              r'<link\b[^>]*url_for\(\s*[\'\"]static[\'\"]\s*,\s*filename\s*=\s*[\'\"][^\'\"]+\.css[\'\"][^)]*\)[^>]*>',
              re.I,
          )

          # Base-backed pages inherit exactly one canonical stylesheet.
          for path in templates.glob("*.html"):
              text = path.read_text(encoding="utf-8")
              text = css_link_re.sub("", text)

              if path.name == "base.html":
                  anchor = "{% block tail_head %}{% endblock %}"
                  canonical = '<link rel="stylesheet" href="{{ url_for(\'static\', filename=\'vano.css\') }}?v={{ vano_build_id }}">'
                  # Avoid duplicating the canonical link if a previous safe edit already added it.
                  text = re.sub(
                      r'\s*<link\b[^>]*filename=[\'\"]vano\.css[\'\"][^>]*>',
                      "",
                      text,
                      flags=re.I,
                  )
                  if anchor not in text:
                      raise SystemExit("base.html tail_head anchor not found")
                  text = text.replace(anchor, anchor + "\n  " + canonical, 1)

              # These are standalone HTML documents and do not inherit base.html.
              if path.name in {"login.html", "live_trip.html", "shared_route.html"}:
                  if "filename='vano.css'" not in text and 'filename="vano.css"' not in text:
                      canonical = '  <link rel="stylesheet" href="{{ url_for(\'static\', filename=\'vano.css\') }}?v={{ vano_build_id }}">\n'
                      if "</head>" not in text:
                          raise SystemExit(f"{path}: missing </head>")
                      text = text.replace("</head>", canonical + "</head>", 1)

              path.write_text(text, encoding="utf-8")

          # Service worker: one stylesheet only.
          sw = static / "vano-sw.js"
          text = sw.read_text(encoding="utf-8")
          text = re.sub(
              r"const PRECACHE=\[.*?\];",
              lambda m: re.sub(
                  r"(?m)^\s*'/static/[^']+\.css',?\s*$",
                  "",
                  m.group(0),
              ).replace("const PRECACHE=[", "const PRECACHE=[\n  '/static/vano.css',", 1),
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r"const CORE_RE=.*?;",
              r"const CORE_RE=/\/static\/(vano\.css|vano-runtime\.js|vano-theme\.js|vano-map\.js|vano-access\.js)$/;",
              text,
              count=1,
          )
          sw.write_text(text, encoding="utf-8")

          # Strip consolidation-only section markers from the canonical stylesheet.
          canonical_css = static / "vano.css"
          css = canonical_css.read_text(encoding="utf-8")
          css = re.sub(r"/\* ===== static/[^*]+?\.css ===== \*/\s*", "", css)
          canonical_css.write_text(css, encoding="utf-8")

          # Remove every legacy stylesheet. Keep only static/vano.css.
          for path in static.glob("*.css"):
              if path.name != "vano.css":
                  path.unlink()

          # Remove temporary consolidation parts.
          for path in static.glob(".vano-css-part*.tmp"):
              path.unlink()

          # Proven orphan from repository-wide reference scan.
          orphan_js = static / "vano-profile-polish.js"
          if orphan_js.exists():
              orphan_js.unlink()

          # Non-runtime design/architecture notes explicitly approved for cleanup.
          docs = root / "docs"
          if docs.exists():
              for path in docs.iterdir():
                  if path.is_file():
                      path.unlink()
              try:
                  docs.rmdir()
              except OSError:
                  pass

          # Rewrite frontend performance tests around the canonical stylesheet.
          perf = root / "tests" / "test_frontend_performance.py"
          perf.write_text(
              """from __future__ import annotations

from pathlib import Path
import re

ROOT = Path(__file__).resolve().parents[1]


def test_localization_does_not_block_first_paint_for_pt_br():
    base = (ROOT / "templates" / "base.html").read_text(encoding="utf-8")
    assert "active_locale != 'pt-BR'" in base
    assert "<script defer src=\\\"{{ url_for('static', filename='vano-i18n.js')" in base


def test_repository_has_one_canonical_stylesheet():
    css_files = sorted(p.name for p in (ROOT / "static").glob("*.css"))
    assert css_files == ["vano.css"]


def test_templates_reference_only_canonical_local_stylesheet():
    refs = set()
    pattern = re.compile(r"filename=['\\\"]([^'\\\"]+\\.css)['\\\"]")
    for path in (ROOT / "templates").glob("*.html"):
        refs.update(pattern.findall(path.read_text(encoding="utf-8", errors="ignore")))
    assert refs == {"vano.css"}


def test_onboarding_stays_lightweight_outside_shared_stylesheet():
    page = (ROOT / "templates" / "onboarding.html").read_text(encoding="utf-8")
    assert "vano-maps-banner.png" not in page
    assert "vano-maps-banner-dark.png" not in page
    assert "vano-maps-icon-64.png" in page
    js = ROOT / "static" / "vano-onboarding.js"
    assert js.stat().st_size < 25_000


def test_canonical_stylesheet_has_reasonable_repository_budget():
    css = ROOT / "static" / "vano.css"
    assert css.exists()
    assert css.stat().st_size < 3_000_000
""",
              encoding="utf-8",
          )

          # Strengthen smoke coverage so legacy CSS cannot silently return.
          smoke = root / "tests" / "test_repository_smoke.py"
          smoke_text = smoke.read_text(encoding="utf-8")
          if "def test_single_canonical_stylesheet_only():" not in smoke_text:
              smoke_text += """


def test_single_canonical_stylesheet_only():
    css_files = sorted(p.name for p in (ROOT / "static").glob("*.css"))
    assert css_files == ["vano.css"]
"""
          smoke.write_text(smoke_text, encoding="utf-8")

          # Remove this one-shot workflow from the resulting branch.
          Path(".github/workflows/repo-cleanup.yml").unlink(missing_ok=True)
          PY

      - name: Validate cleanup before commit
        run: |
          python -m compileall -q app.py vano db_backend.py mobile_routes.py vano_osint_bridge.py vano_ai_routing.py vano_radars.py
          python - <<'PY'
          from pathlib import Path
          css = list(Path("static").glob("*.css"))
          assert [p.name for p in css] == ["vano.css"], css
          assert not list(Path("static").glob(".vano-css-part*.tmp"))
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean repository and consolidate VANO styles"
          git push origin HEAD:cleanup/repository-css-20261003
