name: VANO repository cleanup

on:
  push:
    branches:
      - cleanup/repository-css-20261003

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/repository-css-20261003
          fetch-depth: 0

      - name: Run repository cleanup
        run: python tools/repo_cleanup_once.py

      - name: Validate cleanup
        run: |
          python -m compileall -q app.py vano db_backend.py mobile_routes.py vano_osint_bridge.py vano_ai_routing.py vano_radars.py
          python -m pip install -r requirements.txt -r requirements-dev.txt
          pytest -q

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean repository and consolidate VANO styles"
          git push origin HEAD:cleanup/repository-css-20261003
