name: Analytics isolated validation
on:
  pull_request:
    paths: ['v2/server/analytics*', 'v2/src/lib/telemetry*', 'v2/src/lib/analytics*', '.github/workflows/analytics-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: vano_analytics_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: v2
      - run: node --test server/analytics*.test.mjs src/lib/telemetryClient.test.mjs
        working-directory: v2
        env:
          VANO_ANALYTICS_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/vano_analytics_test
