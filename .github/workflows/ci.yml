name: VANO CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vano_ci
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: vano_ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VANO_SKIP_DB_INIT: "1"
      VANO_DB_INIT_ONLY: "1"
      VANO_KEEPALIVE_ENABLED: "0"
      TEST_DATABASE_URL: "postgresql://vano_ci:isolated_ci_only@localhost:5432/vano_ci"
      VANO_ADMIN_EMAIL: "ci@example.invalid"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py vano db_backend.py mobile_routes.py vano_osint_bridge.py vano_ai_routing.py vano_radars.py
      - run: find static -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: pip-audit -r requirements.txt
      - run: bandit -q -lll -r app.py vano mobile_routes.py vano_osint_bridge.py vano_ai_routing.py vano_radars.py
      - run: pytest -q
