name: VANO CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VANO_SKIP_DB_INIT: "1"
      VANO_DB_INIT_ONLY: "1"
      VANO_KEEPALIVE_ENABLED: "0"
      VANO_ADMIN_EMAIL: "ci@example.invalid"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q app.py vano db_backend.py mobile_routes.py vano_osint_bridge.py vano_ai_routing.py vano_radars.py
      - run: pytest -q
