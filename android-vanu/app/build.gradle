plugins { id 'com.android.application' }
android {
    namespace 'com.vano.maps.fluidez'
    compileSdk 36
    defaultConfig {
        applicationId 'com.vano.maps'
        minSdk 24
        targetSdk 36
        versionCode 20270004
        versionName '3.1.3'
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('VANO_UPLOAD_KEYSTORE')
            def passwordPath = System.getenv('VANO_UPLOAD_PASSWORD_FILE')
            if (keyPath && passwordPath) {
                storeFile file(keyPath)
                storePassword file(passwordPath).text.trim()
                keyAlias 'vano-maps-upload'
                keyPassword storePassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
